name: nullsec-1 ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deterministic-layers:
    # Tests + the Nullsec-1 deterministic security layers. No GPU required.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (runtime + dev, no GPU stack)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Model identity + fingerprint
        run: python -m nullsec.core.version
      - name: Test suite
        run: pytest -q
      - name: Adversarial Safety Layer probes
        run: python -m benchmarks.safety_probes
      - name: Corpus quality validation
        run: python training/validate_corpus.py
      - name: Honesty check (no prohibited language)
        run: |
          if grep -rniE '\b(demo|mock|toy|placeholder|simulated|fake)\b' \
              --include='*.py' nullsec serving cli benchmarks training; then
            echo "::error::prohibited language found in source"; exit 1
          fi
          echo "ok: source is clean"
      - name: Public-claim honesty check (docs match artifacts)
        run: python scripts/validate_claims.py --check

  security-gate:
    # The Nullsec-1 CLI as a CI security gate. It exits non-zero when analyzed
    # code is not production-ready, failing the build. This job runs only when a
    # trained adapter is available via the NULLSEC_ADAPTER_PATH secret/var, since
    # the gate needs the model to produce verdicts.
    runs-on: ubuntu-latest
    needs: deterministic-layers
    if: ${{ vars.NULLSEC_ADAPTER_PATH != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (with training/serving stack)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[train]"
      - name: Run Nullsec-1 security gate over the repo
        env:
          NULLSEC_ADAPTER_PATH: ${{ vars.NULLSEC_ADAPTER_PATH }}
        run: |
          # `nullsec1 analyze` exits non-zero when any analyzed file is not
          # production-ready, which fails the build.
          nullsec1 analyze ./
